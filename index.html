<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Text Compare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #212529;
      --border: #ced4da;
      --btn-primary: #0d6efd;
      --btn-primary-hover: #0b5ed7;
      --btn-secondary: #6c757d;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --border: #30363d;
      --btn-primary: #238636;
      --btn-primary-hover: #2ea043;
      --btn-secondary: #30363d;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid var(--btn-primary);
      border-color: transparent;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .controls-left, .controls-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      padding: 10px 20px;
      background: var(--btn-primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: var(--btn-primary-hover);
    }

    button.secondary {
      background: var(--btn-secondary);
    }

    select {
      padding: 8px 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    #diff-output {
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    #diff-output:empty {
      display: none;
    }
  </style>
</head>
<body>

  <div class="inputs">
    <textarea id="text-left" placeholder="Paste original text here..."></textarea>
    <textarea id="text-right" placeholder="Paste modified text here..."></textarea>
  </div>

  <div class="controls">
    <div class="controls-left">
      <button onclick="runDiff()">Compare Texts</button>
      <button class="secondary" onclick="clearTexts()">Clear Both</button>
      <label style="cursor: pointer; user-select: none;">
        <input type="checkbox" id="ignore-whitespace" onchange="runDiff()"> Ignore Whitespace
      </label>
    </div>

    <div class="controls-right">
      <label for="theme-select">Theme:</label>
      <select id="theme-select" onchange="setTheme(this.value)">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </div>

  <div id="diff-output"></div>

  <script src="https://cdn.jsdelivr.net/npm/diff/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>
  <script>
    const systemDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function getEffectiveTheme(mode) {
      if (mode === 'system') {
        return systemDarkQuery.matches ? 'dark' : 'light';
      }
      return mode;
    }

    function setTheme(mode) {
      localStorage.setItem('theme-preference', mode);
      document.getElementById('theme-select').value = mode;
      const effective = getEffectiveTheme(mode);
      document.documentElement.setAttribute('data-theme', effective);

      if (document.getElementById('diff-output').innerHTML !== '') {
        runDiff();
      }
    }

    systemDarkQuery.addEventListener('change', () => {
      const currentMode = localStorage.getItem('theme-preference') || 'system';
      if (currentMode === 'system') {
        setTheme('system');
      }
    });

    function runDiff() {
      const left = document.getElementById('text-left').value;
      const right = document.getElementById('text-right').value;
      const ignoreWhitespace = document.getElementById('ignore-whitespace').checked;
      const mode = localStorage.getItem('theme-preference') || 'system';
      const effectiveTheme = getEffectiveTheme(mode);

      const patch = Diff.createTwoFilesPatch(
        'Original', 'Modified', left, right, '', '',
        { ignoreWhitespace: ignoreWhitespace, context: 99999 }
      );

      const html = Diff2Html.html(patch, {
        drawFileList: false,
        matching: 'words',
        outputFormat: 'side-by-side',
        colorScheme: effectiveTheme
      });

      document.getElementById('diff-output').innerHTML = html;
    }

    function clearTexts() {
      document.getElementById('text-left').value = '';
      document.getElementById('text-right').value = '';
      document.getElementById('diff-output').innerHTML = '';
    }

    // Initialize saved or default system theme on load
    setTheme(localStorage.getItem('theme-preference') || 'system');
  </script>
</body>
</html>
